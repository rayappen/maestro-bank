spring:
  application:
    name: gatewayserver
  config:
    import: "configserver:http://localhost:8071/"
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s

management:
  endpoints:
    health:
      show-details: always
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true
  
info:
  app:
    name: "gatewayserver"
    description: "Ecommerce Gateway Server Application"
    version: "1.0.0"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{30}) - %cyan(%msg) %n}
  level:
    com:
      eccomerce:
        gatewayserver: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.cloud.gateway.filter.ratelimit: TRACE

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000
