server:
  port: 9001
  servlet:
    context-path: "/ecommerce/api/v1"

spring:
  application:
    name: "cards"
  profiles:
    active: "prod"
  config:
    import: "configserver:http://localhost:8071/"
  datasource:
    url: jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        
management:
  endpoints:
    web:
      exposure:
        include: "info,refresh,health,shutdown"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
    otlp:
      metrics:
        export:
          url: http://localhost:4318/v1/metrics
          steps: 10s
    metrics:
      tags:
        applications: ${spring.application.name}

eureka:
  instance:
    preferIpAddress: true #prefer-ip-address
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "cards"
    description: "Ecommerce cards application"
    version: "1.0.0"

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSSS}) %blue(%-5level) %red([%thread]) %magenta([traceId=%X{traceId:-}], spanId=%X{spanId:-}) - %yellow(%logger{30}) - %cyan(%msg) %n}
  level:
    com:
      ecommerce:
        cards: DEBUG

resilience4j.bulkhead:
  configs:
    default:
      maxConcurrentCalls: 2
      maxWaitDuration: 1s