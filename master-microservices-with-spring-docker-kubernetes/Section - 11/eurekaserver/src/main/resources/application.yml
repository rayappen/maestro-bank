spring:
  application:
    name: eurekaserver
  config:
    import: "optional:configserver:http://localhost:8071"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
    otlp:
      metrics:
        export:
          url: http://localhost:4318/v1/metrics
          steps: 10s
    metrics:
      tags:
        applications: ${spring.application.name}

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSSS}) %blue(%-5level) %red([%thread]) %magenta([traceId=%X{traceId:-}], spanId=%X{spanId:-}) - %yellow(%logger{30}) - %cyan(%msg) %n}
