#Server Configuration
#DataSource Configuration

server:
  port: 8080
  servlet:
    context-path: "/ecommerce/api/v1"

spring:
  application:
    name: accounts
  datasource:
    url: jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  config:
    import:
      - "application_qa.yml"
      - "application_prod.yml"
  profiles:
    active: "prod"

build:
  version: "3.0"
  
accounts:
  message: "Welcome to Ecommerce accounts related Local APIs"
  contactDetails:
    name: "John Doe - Developer"
    email: "johndoe@gmail.com"
    onCallSupport:
      - (555) 555-1234
      - (555) 523-1345